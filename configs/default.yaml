model:
  name: "google/gemma-4-4b-it"
  quantization: "nf4"
  max_seq_length: 4096
  attn_implementation: "eager"
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
training:
  epochs: 3
  batch_size: 2
  gradient_accumulation: 8
  learning_rate: 2.0e-5
  lr_scheduler: "cosine"
  warmup_ratio: 0.1
  bf16: true
  gradient_checkpointing: true
  save_steps: 100
  eval_steps: 100
  logging_steps: 10
data:
  trace_bucket: "hf://buckets/burtenshaw/sft-on-traces"
  dataset_name: "badlogicgames/pi-mono"
  chat_dataset: "sergiopaniego/pi-mono-chat"
  train_split: 0.9
  max_samples: null
  min_turns: 3
  max_tokens: 32768
tracking:
  tool: "trackio"
  project: "sft-coding-agent-pi-mono"
output:
  checkpoint_dir: "./checkpoints"
  data_dir: "./data"
  log_dir: "./logs"
